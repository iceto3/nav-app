<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Navigator</title>
<meta name="theme-color" content="#1a73e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Navigator">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>
<div id="map"></div>
<div id="top">
  <form id="searchForm"><input id="q" type="search" placeholder="Search for a place or address" autocomplete="off"><button type="submit">🔍</button></form>
  <ul id="results" hidden></ul>
</div>
<div id="fabs">
  <button id="voiceBtn" title="Voice guidance">🔇</button>
  <button id="locBtn" title="My location">◎</button>
</div>
<div id="panel" hidden>
  <div id="modes">
    <button data-mode="driving" class="on">🚗 Car</button>
    <button data-mode="cycling">🚲 Bike</button>
    <button data-mode="foot">🚶 Walk</button>
  </div>
  <div id="summary"></div>
  <div id="actions"><button id="goBtn">▶ Start</button><button id="stepsBtn">Directions</button><button id="clearBtn">✕</button></div>
  <ol id="steps" hidden></ol>
</div>
<div id="toast" hidden></div>
<script src="vendor/maplibre-gl.js"></script>
<script src="app.js?v=8"></script>
</body>
</html>
